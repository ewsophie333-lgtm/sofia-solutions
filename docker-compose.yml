services:
  # ==========================================
  # 1. SERVICIO FRONTEND (PHP + Apache)
  # ==========================================
  # Sirve la interfaz de usuario web (dashboard, paneles).
  # Expone el puerto 8000 hacia afuera, conectado al 80 interno.
  frontend:
    build:
      context: .
      dockerfile: frontend-php/Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ./frontend-php/public:/var/www/html
      - ./frontend-php/apache.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      APP_MODE: ${APP_MODE:-secure}
    depends_on:
      - backend

  # ==========================================
  # 2. SERVICIO BACKEND (Node.js + Express)
  # ==========================================
  # API REST principal, gestiona autenticación, WAF, y base de datos.
  backend:
    build:
      context: ./sofia-backend
      dockerfile: docker/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sofia_solutions
      APP_MODE: ${APP_MODE:-secure} # Determina si está en modo vulnerable o seguro
      CORS_ORIGIN: "http://localhost:8000,https://sofia-solutions.serveousercontent.com"
      JWT_SECRET: ${JWT_SECRET:-sofia-super-secret-key-2026}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/alert
    volumes:
      - ./sofia-backend/src:/usr/src/app/src
      - ./sofia-backend/prisma:/usr/src/app/prisma
    ports:
      - "8001:8001"
      - "5555:5555" # Puerto opcional para Prisma Studio (herramienta DB visual)
    depends_on:
      - postgres

  # ==========================================
  # 3. BASE DE DATOS (PostgreSQL)
  # ==========================================
  # Almacena usuarios, incidentes, tickets y telemetría.
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sofia_solutions
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # ==========================================
  # 4. MONITORIZACIÓN Y MÉTRICAS (Prometheus)
  # ==========================================
  # Extrae métricas del backend (eventos de seguridad, bloqueos).
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./sofia-backend/docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # ==========================================
  # 5. DASHBOARDS VISUALES (Grafana)
  # ==========================================
  # Muestra los datos de Prometheus en gráficas en la Consola SOC.
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # Permite embeber las gráficas en el SOC sin login
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_PLUGINS_PREINSTALL: "yesoreyeram-infinity-datasource"
    volumes:
      - ./sofia-backend/docker/grafana/provisioning:/etc/grafana/provisioning
      - ./sofia-backend/docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  # ==========================================
  # 6. TÚNEL INVERSO (Serveo SSH Tunnel)
  # ==========================================
  # Expone los servicios locales (Frontend y n8n) a Internet con SSL seguro.
  # Permite al jurado acceder remotamente a la plataforma.
  tunnel:
    image: alpine
    restart: always
    depends_on:
      - frontend
      - n8n
    volumes:
      - ./tunnel-key:/root/.ssh/id_ed25519
    entrypoint: ""
    command: >
      sh -c "apk add --no-cache openssh-client && 
      ssh -o StrictHostKeyChecking=no 
      -o ServerAliveInterval=15 
      -o ServerAliveCountMax=3 
      -o TCPKeepAlive=yes 
      -i /root/.ssh/id_ed25519 
      -R sofia-solutions:80:frontend:80 
      -R sofia-n8n:80:n8n:5678 
      serveo.net"

  # ==========================================
  # 7. AUTOMATIZACIÓN DE ALERTAS (n8n)
  # ==========================================
  # Recibe los webhooks del backend y envía correos al SOC (Gmail).
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: sofia-n8n.serveousercontent.com
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://sofia-n8n.serveousercontent.com/
      GENERIC_TIMEZONE: Europe/Madrid
      N8N_ENCRYPTION_KEY: sofia-solutions-encryption-key-2026
      N8N_EDITOR_BASE_URL: https://sofia-n8n.serveousercontent.com/
      N8N_DEFAULT_LOCALE: es
      N8N_DEFAULT_TIMEZONE: Europe/Madrid
      DB_TYPE: sqlite
      DB_SQLITE_DATABASE: /home/node/.n8n/database.sqlite
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

  # ==========================================
  # 8. MÉTRICAS DE CONTENEDORES (cAdvisor)
  # ==========================================
  # Analiza el uso de CPU/RAM de los contenedores para detección de anomalías.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sofia-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped

volumes:
  postgres-data:
  n8n-data:
