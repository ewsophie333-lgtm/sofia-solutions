services:
  frontend:
    build:
      context: .
      dockerfile: frontend-php/Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./sofia-backend
      dockerfile: docker/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sofia_solutions
      APP_MODE: ${APP_MODE:-secure}
      CORS_ORIGIN: http://localhost:8000
      JWT_SECRET: ${JWT_SECRET:-sofia-super-secret-key-2026}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/alert
    ports:
      - "8001:8001"
      - "5555:5555"
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sofia_solutions
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./sofia-backend/docker/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
    volumes:
      - ./sofia-backend/docker/grafana/provisioning:/etc/grafana/provisioning
      - ./sofia-backend/docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  tunnel:
    image: alpine
    restart: always
    depends_on:
      - frontend
      - n8n
    volumes:
      - ./tunnel-key:/root/.ssh/id_ed25519
    entrypoint: ""
    command: >
      sh -c "apk add --no-cache openssh-client && 
      ssh -o StrictHostKeyChecking=no 
      -o ServerAliveInterval=15 
      -o ServerAliveCountMax=3 
      -o TCPKeepAlive=yes 
      -i /root/.ssh/id_ed25519 
      -R sofia-solutions:80:frontend:80 
      -R sofia-n8n:80:n8n:5678 
      serveo.net"

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: sofia-n8n.serveo.net
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://sofia-n8n.serveo.net/
      GENERIC_TIMEZONE: Europe/Madrid
      N8N_ENCRYPTION_KEY: sofia-solutions-encryption-key-2026
      N8N_EDITOR_BASE_URL: https://sofia-n8n.serveo.net/
      N8N_DEFAULT_LOCALE: es
      N8N_DEFAULT_TIMEZONE: Europe/Madrid
      DB_TYPE: sqlite
      DB_SQLITE_DATABASE: /home/node/.n8n/database.sqlite
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: sofia-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped

volumes:
  postgres-data:
  n8n-data:
